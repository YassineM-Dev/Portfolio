<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Reviews — Yassine</title>
  <meta name="description" content="Client reviews and ratings (1 to 5 stars) for Yassine's software development, web design, and creative work." />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("yassine_theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.setAttribute("data-theme", saved);
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="custom-bg" aria-hidden="true">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-grid"></div>
    <div class="bg-spotlight" id="bg-spotlight"></div>
  </div>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" id="top">
    <div class="container header-inner">
      <a href="index.html" class="brand" aria-label="Back to Yassine portfolio">
        <span class="brand-name" id="brand-name">Yassine</span><span class="brand-dot" aria-hidden="true">.</span>
      </a>

      <nav class="nav-links" aria-label="Reviews navigation">
        <a href="index.html" class="nav-link back-nav-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5"></path>
            <path d="m12 19-7-7 7-7"></path>
          </svg>
          <span data-i18n="reviewsPage.back">Back to Portfolio</span>
        </a>
      </nav>

      <div class="header-controls">
        <button type="button" class="control-btn mono" id="lang-toggle" aria-label="Switch language" title="Switch language">
          FR
        </button>
        <button type="button" class="control-btn icon-btn" id="theme-toggle" aria-label="Toggle color theme" title="Toggle theme">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="section reviews-page-hero">
      <div class="container">
        <div class="section-header">
          <div>
            <span class="section-kicker mono" data-i18n="reviewsPage.kicker">Client Feedback</span>
            <h1 class="section-title reviews-page-title">
              <span data-i18n="reviewsPage.title">All Client Reviews</span>
              <span class="count-badge mono" id="all-reviews-count">00</span>
            </h1>
          </div>

          <a href="index.html#reviews" class="btn btn-primary" data-i18n="reviewsPage.leaveBtn">
            Leave a Review
          </a>
        </div>

        <div class="reviews-overview-banner" id="reviews-overview-banner">
          <div class="overview-score-col">
            <div class="overview-score mono" id="page-avg-score">—</div>
            <div id="page-avg-stars"></div>
            <p class="overview-meta mono" id="page-total-label">0 reviews</p>
          </div>
          <div class="rating-breakdown" id="page-rating-breakdown">
            <!-- Rendered dynamically -->
          </div>
        </div>

        <div class="reviews-toolbar">
          <div class="filter-bar" id="rating-filters" role="tablist" aria-label="Filter reviews by rating">
            <!-- Rendered dynamically -->
          </div>
        </div>

        <div class="all-reviews-grid" id="all-reviews-grid">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copy mono">&copy; <span id="footer-year">2026</span> <span id="footer-name">Yassine</span></p>
      <a href="index.html" class="footer-top mono" data-i18n="reviewsPage.back">Back to Portfolio</a>
    </div>
  </footer>

  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/reviews-store.js" defer></script>
  <script src="assets/js/reviews.js" defer></script>
</body>
</html>
